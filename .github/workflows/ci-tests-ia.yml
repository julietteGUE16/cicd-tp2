name: CI - Tests Automatisés avec IA

on:
  push:
    branches: [ juliette-deploy ]
  pull_request:
    branches: [ juliette-deploy ]

jobs:
    test-and-analyze:
      name: Tests + Analyse IA
      runs-on: ubuntu-latest
    
      strategy:
        matrix:
          python-version: ['3.11']

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: python
          uses: actions/setup-python@v4
          with:
            python-version: ${{ matrix.python-version }}
            cache: 'pip'

        - name: Install dependencies
          run: | 
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Setup Chrome
          uses: browser-actions/setup-chrome@latest

        - name: Génération des tests IA
          run: |
            echo "Exécution des tests générés..."
            pytest tests/genereted/ -v --html=reports/genereted-report.html --self-contained-html
          continue-on-error: true
        
        - name: Exec des tests visuels
          if: always()
          run: |
            echo "Exécution complète de la suite de tests avec collecte Allure..."
            pytest tests/ -v \
              --html=reports/full-report.html .-self-contained-html \
              --alluredir=reports/allure-results
          continue-on-error: true

        - name: Génération du rapport Allure
          if: always()
          run: |
            echo "Installation de Allure CLI et génération du rapport..."
            npm install -g allure-commandline
            allure generete reports/allure-results --clean -o reports/allure-report

        - name: Upload des rapports de tests
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: tests-reports
            path: reports/
            retention-days: 30
        
        - name: Upload des screenshots
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: screenshots
            path: screenshots/
            retention-days: 30